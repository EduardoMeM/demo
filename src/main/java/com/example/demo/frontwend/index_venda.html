<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas</title>
    <link rel="stylesheet" href="style_cliente.css">
    
</head>
<body>
    
    <nav>
        <img src="imagens/ChatGPT Image 29 de jun. de 2026, 20_09_43-logo vendas.png" id="titulo_principal"><br>
    </nav>
    <header>
    <main>
        
        <div class="user-info">
          <h2 id="cadastro">Cadastro das vendas</h2><br>
          <h3 >
            ID Venda: <input placeholder="ID Venda" id="id_venda" type="number" required pattern="number"></input><br>
            Cliente: <input placeholder="Cliente" id="cliente" type="number" required pattern="[A-Za-zÀ-y\s]"></input><br>
            Data da venda: <input placeholder="Data" id="data_venda" type="date" required></input><br> 
            Valor Total: <input placeholder="Valor Total" id="valor_total" type="number" required pattern="[0-9] {10,11} [()]"></input><br>
            Forma de Pagamento: <input placeholder="Forma de pagamento" id="formade_pagamento" type="text" required pattern="[A-Za-zÀ-y\s]"></input><br>
            Status: <input placeholder="Status" id="statu" type="text" required></input><br> 
            <button id="botaoCadstrar" onclick="cadastrarVenda()">Cadastrar</button>
            <button type="button" id="botao_limpar" onclick="cadastroLimpar()">Limpar</button>   
            <button type="button" id="buscar" onclick="buscar_venda()">Buscar</button>
            <button type="button" id="listar" onclick="listar_venda()">Listar</button>
           </h3>
        </div>

        <table border="1">
        <thead>
            <tr>
             <th>Id Venda</th>
             <th>Cliente</th>
             <th>Data venda</th>
             <th>Valor total</th>   
             <th>Forma de pagamento</th>
             <th>Status da venda</th>
             <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaVenda">

        </tbody>
    </table>
    <script src="script._venda.js"></script>
    </main>
    </header>
</body>
</html>
