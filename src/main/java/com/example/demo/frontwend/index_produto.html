<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <link rel="stylesheet" href="style_produto.css">
</head>
<body>
    <nav>
        <img src="imagens/ChatGPT Image 26 de jun. de 2026, 19_51_32-logo produto.png" id="titulo_principal"><br>
    </nav>
    <header>
    <main>
        
        <div class="user-info">
          <h2 id="cadastro">Cadastro de produto</h2><br>
          <h3 >
            ID Produto: <input placeholder="ID Produto" id="id_produto" type="number" required pattern="number"></input><br>
            Nome do produto: <input placeholder="Nome do Produto" type="text" id="nome_produto" required pattern="[A-Za-zÀ-y\s]"></input><br>
            Preço: <input placeholder="Preço" id="preco" type="number" required></input><br> 
            Quantidade em Estoque: <input placeholder="Quantidade em Estoque" id="quantidade_estoque" type="number" step="0.01" min="0" required pattern="[0-9] {10,11} [()]"></input><br>
            Descrição: <input placeholder="Descrição" id="descricao" type="text" required pattern="[A-Za-zÀ-y\s]"></input><br>
            <button id="botaoCadstrar" onclick="cadastrarProduto()">Cadastrar</button>
            <button type="button" id="botao_limpar" onclick="cadastroLimpar()">Limpar</button>   
            <button type="button" id="buscar" onclick="listar_produto()">Listar</button>
            <button type="button" id="listar" onclick="buscar_produto()">Buscar</button>
           </h3>
        </div>

        <table border="1">
        <thead>
            <tr>
             <th>ID</th>
             <th>Nome do produto</th>
             <th>Preço</th>
             <th>Quantidade em Estoque</th>
             <th>Descrição</th>   
             <th>Ações</th>
            </tr>
        </thead>
        <tbody id="tabelaProdutos">

        </tbody>
    </table>
    <script src="script._produto.js"></script>
    </main>
    </header>
    
</body>
</html>
