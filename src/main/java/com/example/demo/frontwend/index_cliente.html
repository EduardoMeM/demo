<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente</title>
    <link rel="stylesheet" href="style_cliente.css">
    
</head>
<body>
    
    <nav>
        <img src="imagens/ChatGPT Image 25 de jun. de 2026, 22_42_02-logo cliente.png" id="titulo_principal"><br>
    </nav>
    <header>
    <main>
        
        <div class="user-info">
          <h2 id="cadastro">Cadastro de Clientes</h2><br>
          <h3 >
            Nome: <input placeholder="Nome" id="nome" type="text" required pattern="[A-Za-zÀ-y\s]"></input><br>
            Email: <input placeholder="E-mail" id="email" type="email" required></input><br> 
            Telefone: <input placeholder="Telefone" id="telefone" type="tel" required pattern="[0-9] {10,11} [()]"></input><br>
            <button id="botaoCadstrar" onclick="cadastrarCliente()">Cadastrar</button>
            <button type="button" id="botao_limpar" onclick="cadastroLimpar()">Limpar</button>   
            <button type="button" id="buscar" onclick="window.location.href='/editar'">Buscar</button>
           </h3>
        </div>

        <table border="1">
        <thead>
            <tr>
             <th>Nome</th>
             <th>Email</th>
             <th>Telefone</th>   
             <th>Ações</th>
            </tr>
        </thead>
        <tbody id="listaCliente">

        </tbody>
    </table>
    <script src="js/script.js"></script>
    <script src="index.js"></script>
    </main>
    </header>
    <script src="script._cliente.js" ></script>
</body>
</html>
